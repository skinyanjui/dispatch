name: Foundation CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_local
          POSTGRES_DB: relay_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://relay:relay_local@127.0.0.1:5432/relay_qa
      SEED_PASSWORD: FictionalCIOnly2026
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Throwaway per-run key for encrypted notification bodies and MFA secrets.
      - run: echo "RELAY_DATA_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm run db:migrate && npm run db:migrate && npm run db:seed
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run verify:restore
        env:
          RELAY_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      # The upload test fakes a bucket host; the CSP must allow it.
      - run: VERCEL_ENV=production RELAY_CSP_CONNECT_EXTRA=https://bucket.example.test npm run build:vercel
      - run: npx playwright install --with-deps chromium
      - run: |
          RELAY_AI_PROVIDER=fixture npm start > /tmp/relay-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            artifacts/
