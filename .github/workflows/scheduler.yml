name: Scheduler

# Runs Relay's 15-minute job: appointment reminders (including the two-hour
# tier) and delivery of queued messages. Vercel's own cron on the Hobby plan
# can only run daily, so this calls the same endpoint more often.
#
# It does nothing, and says so in the run, until you opt in (ADR 0046):
#   Settings -> Secrets and variables -> Actions
#     Variable  RELAY_JOBS_URL  https://your-domain.example   (no trailing slash)
#     Secret    CRON_SECRET     the same value the app has
# A failed call fails the run, which GitHub reports to repository watchers.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the 15-minute tick
        env:
          RELAY_JOBS_URL: ${{ vars.RELAY_JOBS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          if [ -z "$RELAY_JOBS_URL" ]; then
            echo "::notice::Scheduler is off: the Actions variable RELAY_JOBS_URL is not set, so no reminders, deliveries or exports are being run from here. See ADR 0046."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the Actions secret CRON_SECRET to the app's cron secret before relying on reminders. No job was called."
            exit 1
          fi
          code=$(curl -sS --max-time 90 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${RELAY_JOBS_URL}/api/jobs/notifications?scope=tick")
          cat response.json
          echo
          # 200 also covers {"skipped":"running"}: another run still holds the lock.
          test "$code" = "200"
