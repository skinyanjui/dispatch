services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
      POSTGRES_DB: relay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - relay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      retries: 20
volumes:
  relay-db:
